name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:contrast
      - run: npm run format:check
      - run: npm audit --audit-level=high

  frontend-build:
    name: Build ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@mfe/shared"
          - mfe-host
          - mfe-student
          - mfe-institution
          - mfe-activity
          - mfe-dashboard
          - mfe-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build --workspace=${{ matrix.workspace }}

  ci:
    name: CI gate
    if: always()
    needs: [frontend-quality, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        run: |
          if [[ "${{ needs.frontend-quality.result }}" != "success" || "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
