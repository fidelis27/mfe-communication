services:
  - type: web
    name: secretaria-api
    runtime: go
    rootDir: modules/backend
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_TLS
        value: "true"
      - key: CORS_ORIGINS
        value: "https://mfe-communication-host.vercel.app,https://mfe-communication-mfe-activity.vercel.app,https://mfe-communication-mfe-student.vercel.app,https://mfe-communication-mfe-institution.vercel.app,https://mfe-communication-mfe-dashboard.vercel.app,https://mfe-communication-mfe-admin.vercel.app"
